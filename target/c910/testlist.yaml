- test: c910_xthead_rand_test
  description: Random C910 XThead integer instructions
  iterations: 1
  no_iss: 1
  gcc_opts: >
    -march=rv64imafdcxtheadc
    -mabi=lp64d
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=500
    +num_of_sub_program=0
    +boot_mode=m
    +march=RV64X
    +no_branch_jump=1
    +no_load_store=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_dret=1
    +no_fence=1
    +no_wfi=1
    +disable_compressed_instr=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
  rtl_test: core_base_test
