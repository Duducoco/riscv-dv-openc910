- test: c910_xthead_rand_test
  description: Random C910 XThead integer instructions
  iterations: 1
  no_iss: 1
  gcc_opts: >
    -march=rv64imafdcxtheadc
    -mabi=lp64d
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=500
    +num_of_sub_program=0
    +boot_mode=m
    +march=RV64X
    +no_branch_jump=1
    +no_load_store=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_dret=1
    +no_fence=1
    +no_wfi=1
    +disable_compressed_instr=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
  rtl_test: core_base_test

- test: c910_xthead_memory_test
  description: Complete C910 XThead private load/store instruction smoke test
  iterations: 1
  no_iss: 1
  gcc_opts: >
    -march=rv64imafdcxtheadc
    -mabi=lp64d
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=100
    +num_of_sub_program=0
    +boot_mode=m
    +march=RV64X
    +enable_floating_point=1
    +no_branch_jump=1
    +no_load_store=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_dret=1
    +no_fence=1
    +no_wfi=1
    +disable_compressed_instr=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +stream_name_0=riscv_c910_memory_instr_stream
    +stream_freq_0=10
  rtl_test: core_base_test

